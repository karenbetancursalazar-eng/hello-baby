# Configuracion de la aplicacion Spring Boot - Hello Baby
server.port=8081
server.servlet.context-path=/hello-baby-springboot
spring.application.name=hello-baby-springboot

# Resolucion de vistas JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Conexion a MySQL. Los valores sensibles se toman de variables de entorno;
# la contrasena no se guarda en el repositorio.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hello_baby?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No se crea ni modifica el esquema: la base ya existe y se gestiona en database/
spring.sql.init.mode=never
